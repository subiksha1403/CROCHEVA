<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CROCHEVA</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <div class="brand-name">
            <a href="index.html">CROCHEVA</a>
        </div>

        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="categories.html">Categories</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
            <a href="login.html" class="active">Login</a>
        </nav>

    </header>


    <!-- LOGIN SECTION -->
    <main class="login-page">

        <div class="login-card">

            <div class="login-heading">
                <p class="small-title">WELCOME BACK</p>
                <h1>Login to CROCHEVA</h1>
                <p>
                    Sign in to continue your crochet shopping journey.
                </p>
            </div>


            <!-- MESSAGE -->
            <div id="loginMessage" class="message"></div>


            <!-- LOGIN FORM -->
            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="show-password"
                        >
                            Show
                        </button>

                    </div>
                </div>


                <button type="submit" class="login-btn">
                    LOGIN
                </button>

            </form>


            <!-- REGISTER LINK -->
            <div class="register-text">
                <p>
                    Don't have an account?
                    <a href="register.html">Create Account</a>
                </p>
            </div>


            <!-- BACK HOME -->
            <a href="index.html" class="back-home">
                ← Back to Home
            </a>

        </div>

    </main>


    <!-- FOOTER -->
    <footer class="footer">
        <p>
            © <span id="currentYear"></span> CROCHEVA. All Rights Reserved.
        </p>
    </footer>


    <script src="login.js"></script>

</body>
</html>
